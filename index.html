<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turismo Chile — Mapa de Parques Nacionales y Reservas</title>
  <meta name="description" content="Mapa interactivo de los parques nacionales y reservas naturales de Chile: senderos, evaluación, pueblos de acceso y tours." />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Panel lateral -->
    <aside id="sidebar" class="sidebar">
      <header class="sidebar__header">
        <h1 class="sidebar__title">🇨🇱 Turismo Chile</h1>
        <p class="sidebar__subtitle">Parques, reservas y panoramas de aventura</p>
      </header>

      <div class="controls">
        <input
          type="search"
          id="search"
          class="controls__search"
          placeholder="Buscar lugar, región o pueblo…"
          autocomplete="off"
        />
        <div class="controls__filters" id="typeFilters"></div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="progress" id="progress"></div>
      <div class="estado-filter" id="estadoFilter"></div>

      <ul class="places" id="placesList" aria-label="Lista de lugares"></ul>

      <footer class="sidebar__footer">
        <span id="footerCount"></span>
        <span class="sidebar__source">Datos: elaboración propia con base en CONAF · aproximados</span>
      </footer>
    </aside>

    <!-- Mapa -->
    <main class="map-wrap">
      <div id="map"></div>
      <button id="toggleSidebar" class="toggle-sidebar" aria-label="Mostrar/ocultar panel">☰</button>
    </main>

    <!-- Detalle -->
    <section id="detail" class="detail" aria-live="polite" hidden>
      <button id="detailClose" class="detail__close" aria-label="Cerrar detalle">✕</button>
      <div id="detailContent"></div>
    </section>
  </div>

  <!-- Mapa propio (sin librerías externas) + datos incrustados: funciona con doble clic -->
  <script src="js/minimap.js"></script>
  <script src="data/lugares.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
